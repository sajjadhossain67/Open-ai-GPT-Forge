services:
  opengpt-forge:
    build: .
    ports:
      - "3080:3080"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      FORGE_DATA_DIR: /data
      FORGE_WORKSPACE_ROOT: /workspace
      FORGE_SANDBOX_MODE: workspace-write
    volumes:
      - forge-data:/data
      - ./:/workspace
    restart: unless-stopped

volumes:
  forge-data:
